name: sfw-free update

# Opens an issue when a newer sfw-free release is at least 7 days old. It never
# changes code or opens pull requests: a maintainer adopts the release (see
# CONTRIBUTING.md, "Updating sfw-free").

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sfw-free-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Look for a newer release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-sfw-free.mjs
      - name: Open an issue unless one is open
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.check.outputs.title }}
          BODY_FILE: ${{ steps.check.outputs.body-file }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == env.TITLE)) | length")"
          if [ "$existing" != "0" ]; then
            echo "An open issue already tracks: $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$BODY_FILE"
