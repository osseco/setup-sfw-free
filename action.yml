name: Setup Socket Firewall Free
description: Install Socket Firewall Free (sfw), verified against checksums pinned in this action
author: osseco

branding:
  icon: shield
  color: green

inputs:
  cache:
    description: >-
      Keep the sfw binary in this repository's Actions cache, so later jobs
      don't download it from GitHub releases. A restored binary is verified
      against the pinned sha256 before use. true (restore, and save after a
      download), restore (restore only, never save) or false (always
      download).
    required: false
    default: "true"
  job-summary:
    description: >-
      What the post step writes to the job summary from the sfw report: all
      (also when nothing was blocked), errors (only blocked packages and
      unparsable requests), or none (no report is requested from sfw).
    required: false
    default: errors

outputs:
  version:
    description: Installed sfw-free version, for example 1.15.6
  path:
    description: Absolute path to the sfw binary
  cache-hit:
    description: true when the binary came from the Actions cache, otherwise false
  report-path:
    description: >-
      Path of the JSON report sfw writes (SFW_JSON_REPORT_PATH); empty when
      job-summary is none

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
